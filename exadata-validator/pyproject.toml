[project]
name = "exadata-validator"
version = "0.0.1"
description = "Validate data-model folders using DuckDB."
readme = "README.md"
authors = [
    { name = "Exaflow Team" },
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "click>=8.5.0,<8.6.0",
    "duckdb>=1.5.6,<1.6.0",
]

[project.scripts]
exadata-validator = "validator.commands:entry"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
