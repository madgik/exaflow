[project]
name = "exadata-validator"
version = "0.0.1"
description = "Validate data-model folders using DuckDB."
readme = "README.md"
authors = [
    { name = "Exaflow Team" },
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "click>=8.1.0,<8.2.0",
    "duckdb>=1.1.0,<1.2.0",
]

[project.scripts]
exadata-validator = "validator.commands:entry"

[dependency-groups]
dev = [
    "pytest>=8.4.0,<8.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
