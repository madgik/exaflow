ip = "127.0.0.1"
federation = "dementia"
log_level = "DEBUG"
framework_log_level ="INFO"

exareme3_algorithm_folders = "./exaflow/algorithms/exareme3,./tests/algorithms/exareme3"

worker_landscape_aggregator_update_interval = 3000
worker_tasks_timeout = 180
max_concurrent_experiments = 32

[controller]
port = 5100

# Connect to an externally provisioned broker. Keep credentials out of version control.
[rabbitmq]
enabled = false
url = "${RABBITMQ_URL:-}"
request_queue = "exaflow.analysis.requests"
dead_letter_queue = "exaflow.analysis.dead"

[privacy]
minimum_row_count = 10
protect_local_data = false

[aggregation_server]
enabled = true
port = 50051
max_wait_for_aggregation_inputs = 30

[[workers]]
id = "localworker1"
grpc_port=5671

[[workers]]
id = "localworker2"
grpc_port=5672
