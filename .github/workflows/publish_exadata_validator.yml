name: Publish exadata-validator

on:
  release:
    types: [published]

jobs:
  build_and_publish:
    name: Build and publish exadata-validator to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: exadata-validator

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.0"
          enable-cache: true

      - name: Set package version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="${RELEASE_TAG#v}"
          if [ -z "$PACKAGE_VERSION" ]; then
            echo "Release tag is empty." >&2
            exit 1
          fi
          uv version "$PACKAGE_VERSION"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Clean previous build artifacts
        run: rm -rf dist

      - name: Build package
        run: uv build

      - name: Validate package metadata
        run: uv run --with twine --no-project -- python -m twine check dist/*

      - name: Publish package to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --token "$UV_PUBLISH_TOKEN"
