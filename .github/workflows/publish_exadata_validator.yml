name: Publish exadata-validator

on:
  release:
    types: [published]

jobs:
  build_and_publish:
    name: Build and publish exadata-validator to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: exadata-validator

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.3.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Set package version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="${RELEASE_TAG#v}"
          if [ -z "$PACKAGE_VERSION" ]; then
            echo "Release tag is empty." >&2
            exit 1
          fi
          poetry version "$PACKAGE_VERSION"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Clean previous build artifacts
        run: rm -rf dist

      - name: Build package
        run: poetry build

      - name: Validate package metadata
        run: |
          poetry run python -m pip install --upgrade pip twine
          poetry run python -m twine check dist/*

      - name: Publish package to PyPI
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
        run: poetry publish --no-interaction --skip-existing
