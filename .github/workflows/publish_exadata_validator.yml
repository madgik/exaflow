name: Publish exadata-validator

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_and_publish:
    name: Build and publish exadata-validator to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: exadata-validator

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Set package version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="${RELEASE_TAG#v}"
          if [ -z "$PACKAGE_VERSION" ]; then
            echo "Release tag is empty." >&2
            exit 1
          fi
          uv version "$PACKAGE_VERSION"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Clean previous build artifacts
        run: rm -rf dist

      - name: Build package
        run: uv build

      - name: Validate package metadata
        run: uv run --with twine --no-project -- python -m twine check dist/*

      - name: Publish package to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --token "$UV_PUBLISH_TOKEN"
