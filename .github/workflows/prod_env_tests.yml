name: Production Env Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run_tests:
    runs-on: ubuntu-latest
    env:
      CI_FREE_UP_SPACE: "true"

    steps:
      - name: Free up space in the background, by removing dotnet, android and haskell unused libs.
        if: env.CI_FREE_UP_SPACE == 'true'
        run: nohup sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android >/dev/null 2>&1 &

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups --no-install-project

      - name: Build data paths for workers
        run: |
          python tests/worker_data_paths_builder.py \
            --local-workers localworker3 localworker2 localworker1 \
            --global-worker globalworker \
            --test-data-folder tests/test_data

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Load Docker buildx cache
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('exaflow/**') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # The registry is started by hand (not by kind-action) so images can be
      # built and pushed while the Kind cluster is being created.
      - name: Start local image registry
        run: |
          docker run -d --restart=always --name kind-registry \
            -e REGISTRY_HTTP_ADDR=0.0.0.0:5001 \
            -p 127.0.0.1:5001:5001 registry:2

      - name: Build and push images in the background
        run: |
          nohup bash -c '
            docker buildx bake -f .github/workflows/docker-bake.hcl default --push \
              --set worker.cache-from=type=local,src=/tmp/.buildx-cache/worker \
              --set worker.cache-to=type=local,dest=/tmp/.buildx-cache-new/worker,mode=max \
              --set controller.cache-from=type=local,src=/tmp/.buildx-cache/controller \
              --set controller.cache-to=type=local,dest=/tmp/.buildx-cache-new/controller,mode=max \
              --set aggregation_server.cache-from=type=local,src=/tmp/.buildx-cache/aggregation_server \
              --set aggregation_server.cache-to=type=local,dest=/tmp/.buildx-cache-new/aggregation_server,mode=max
            echo $? > /tmp/bake.exit
          ' > /tmp/bake.log 2>&1 &
        env:
          REGISTRY: localhost:5001
          # bake-action sets this too; local cache dirs under /tmp need fs write access.
          BUILDX_BAKE_ENTITLEMENTS_FS: 0

      - name: Create k8s Kind Cluster
        id: kind
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: kind
          config: tests/prod_env_tests/deployment_configs/kind_configuration/kind_cluster.yaml
          registry: false

      - name: Configure Kind registry on nodes
        run: |
          REG_HOST="localhost:5001"
          docker network connect kind kind-registry
          # Wire the local registry into Kind: map runner localhost to the in-network registry
          # so containerd on each node can pull freshly built images without a remote registry.
          for node in $(kind get nodes --name kind); do
            docker exec "$node" mkdir -p "/etc/containerd/certs.d/${REG_HOST}"
            cat <<'EOF' | docker exec -i "$node" tee "/etc/containerd/certs.d/${REG_HOST}/hosts.toml"
          [host."http://kind-registry:5001"]
            capabilities = ["pull", "resolve", "push"]
          EOF
          done

      - name: Wait for image build
        run: |
          while [ ! -f /tmp/bake.exit ]; do sleep 2; done
          cat /tmp/bake.log
          [ "$(cat /tmp/bake.exit)" = 0 ]
          # Temp fix
          # https://github.com/docker/build-push-action/issues/252
          # https://github.com/moby/buildkit/issues/1896
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: 4.3.1
        id: install

      - name: Taint Nodes
        run: |
          kubectl taint nodes master node-role.kubernetes.io/control-plane-
          kubectl label node master master=true
          kubectl label node localworker1 worker=true
          kubectl label node localworker2 worker=true
          kubectl label node localworker3 worker=true

      - name: Copy prod_env_tests values.yaml
        run: cp -r tests/prod_env_tests/deployment_configs/kubernetes_values.yaml kubernetes/values.yaml

      - name: Rewrite image repos for local registry
        run: |
          REG="localhost:5001"
          # Point Helm values at the local Kind registry so pods pull the locally built images.
          sed -i "s#repository: madgik#repository: ${REG}/madgik#g" kubernetes/values.yaml

      - name: Print Helm Templates
        run: helm template kubernetes/

      - name: Deploy Helm
        run: helm install exaflow kubernetes/ --debug

      - name: Wait for pods to get healthy
        run: |
          set +e
          timeout 300 bash -c '
          set -euo pipefail

          while true; do
            # Get pods and check if all are ready (1/1, 2/2, 3/3, 4/4)
            if kubectl get pods --no-headers | awk '\''{if ($2 != "1/1" && $2 != "2/2" && $2 != "3/3" && $2 != "4/4") exit 1;}'\''; then
              echo "All pods are ready!"
              break
            else
              echo "Some pods are not ready yet:"
              kubectl get pods -o wide

              # Find clearly "bad" pods (crashing / failing)
              crashing_pods=$(kubectl get pods --no-headers \
                | awk '\''$3 ~ /CrashLoopBackOff|Error|ImagePullBackOff|CreateContainerError/ {print $1}'\'')

              if [ -n "$crashing_pods" ]; then
                echo "Detected crashing pods: $crashing_pods"

                for p in $crashing_pods; do
                  echo "===== DESCRIBE POD $p ====="
                  kubectl describe pod "$p" || true

                  echo "===== LOGS POD $p (all containers) ====="
                  kubectl logs "$p" --all-containers --tail=200 || true

                  echo "===== PREVIOUS LOGS POD $p (if any) ====="
                  kubectl logs "$p" --all-containers --previous --tail=200 || true
                done

                echo "Failing because at least one pod is crashing."
                exit 1
              fi

              sleep 2
            fi
          done
          '
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 0 ]; then
            if [ "$exit_code" -eq 124 ]; then
              echo "Timeout exceeded while waiting for pods. Describing unready pods..."
              unready_pods=$(kubectl get pods --no-headers \
                | awk '$2 != "1/1" && $2 != "2/2" && $2 != "3/3" && $2 != "4/4" {print $1}')
              if [ -n "$unready_pods" ]; then
                for p in $unready_pods; do
                  echo "===== DESCRIBE POD $p ====="
                  kubectl describe pod "$p" || true
                done
              else
                echo "No unready pods found to describe."
              fi
            fi
            exit "$exit_code"
          fi

      - name: Controller logs
        run: kubectl logs -l app=exaflow-controller -c controller --tail -1

      - name: Aggregation Server logs
        run: kubectl logs -l app=exaflow-aggregation-server -c aggregation-server --tail -1

      - name: Globalworker logs
        run: kubectl logs -l nodeType=globalworker -c worker --tail -1

      - name: Localworker logs
        run: kubectl logs -l nodeType=localworker -c worker --tail -1

      - name: Aggregation Server logs
        run: kubectl logs -l nodeType=localworker -c worker --tail -1

      - name: Controller logs (post run)
        uses: webiny/action-post-run@3.1.0
        with:
          run: kubectl logs -l app=exaflow-controller -c controller --tail -1

      - name: Aggregation Server logs (post run)
        uses: webiny/action-post-run@3.1.0
        with:
          run: kubectl logs -l app=exaflow-aggregation-server -c aggregation-server --tail -1

      - name: Globalworker logs (post run)
        uses: webiny/action-post-run@3.1.0
        with:
          run: kubectl logs -l nodeType=globalworker -c worker --tail -1

      - name: Localworker logs (post run)
        uses: webiny/action-post-run@3.1.0
        with:
          run: kubectl logs -l nodeType=localworker -c worker --tail -1

      - name: Wait before WLA update
        run: sleep 5

      - name: Run Worker Landscape Aggregator update
        run: curl -X POST "http://172.17.0.1:5100/wla"

      - name: Run Healthcheck
        run: curl "http://172.17.0.1:5100/healthcheck"

      - name: Run production env tests
        run: uv run --no-sync pytest tests/prod_env_tests --verbosity=4

      - name: Pod restarts and probe failures
        if: always()
        run: |
          kubectl get pods -o custom-columns='POD:.metadata.name,RESTARTS:.status.containerStatuses[*].restartCount,LAST_TERMINATION:.status.containerStatuses[*].lastState.terminated.reason,EXIT_CODE:.status.containerStatuses[*].lastState.terminated.exitCode'
          kubectl get events --field-selector type=Warning --sort-by=.lastTimestamp
          kubectl get events --field-selector reason=Killing --sort-by=.lastTimestamp
          kubectl logs -l nodeType=globalworker -c worker --previous --tail 50 || true
