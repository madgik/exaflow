name: Exadata Validator

on:
  push:
    branches: [master]
    paths:
      - "exadata-validator/**"
      - ".github/workflows/exadata_validator.yml"
  pull_request:
    branches: [master]
    paths:
      - "exadata-validator/**"
      - ".github/workflows/exadata_validator.yml"

jobs:
  test_build_and_smoke_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exadata-validator

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run validator tests
        run: uv run --no-sync pytest -q

      - name: Build validator package
        run: uv build

      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/exadata-validator-smoke
          source /tmp/exadata-validator-smoke/bin/activate
          pip install --upgrade pip
          pip install dist/exadata_validator-*.whl
          exadata-validator validate-data-model tests/data/success/data_model1_v_1_0
          python -m validator validate-data-model tests/data/success/data_model_longitudinal_v_1_0
