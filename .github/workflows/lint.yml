name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.9.6" # Must be upgraded together with pyproject.toml
          args: "check --select I"
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.9.6" # Must be upgraded together with pyproject.toml
          args: "format --check"
