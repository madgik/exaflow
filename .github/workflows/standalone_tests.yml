name: Standalone Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups --no-install-project

      - name: Run all standalone tests except the SMPC
        id: non_smpc_tests
        run: uv run --no-sync pytest -q -n auto --dist worksteal -m "not smpc" --cov=exaflow --cov-report=xml:non_smpc_cov.xml tests/standalone_tests
        env:
          PYTHONPATH: ${{ github.workspace }}/exaflow:${{ github.workspace }}
          PULL_DOCKER_IMAGES: false

#      Skip due to failing SMPC
#      - name: Run SMPC specific standalone tests after releasing previous test resources
#        if: success() || ( failure() && steps.non_smpc_tests.outcome == 'failure' )
#        run:  |
#          uv run --no-sync inv cleanup
#          uv run --no-sync pytest -s -m "smpc" --cov=exaflow --cov-report=xml:smpc_cov.xml tests/standalone_tests --verbosity=4 --reruns 3 --reruns-delay 5
#        env:
#          PULL_DOCKER_IMAGES: false

      - name: Upload coverage to Qlty
        uses: qltysh/qlty-action/coverage@357cd88be7c73c5dc45cf7cf8f99a46ec0b62b73 # v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: ./non_smpc_cov.xml
          add-prefix: exaflow/
#          files: ./non_smpc_cov.xml,./smpc_cov.xml
