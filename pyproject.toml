[project]
name = "exaflow"
version = "1.0.0"
description = "Core engine for the Medical Informatics Platform"
authors = [
    { name = "Your Name", email = "you@example.com" },
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "click>=8.3.0,<8.4.0",
    "pydantic>=2.12.0,<2.13.0",
    "envtoml>=0.4.0,<0.5.0",
    "numpy>=2.2.0,<2.3.0",
    "scipy>=1.15.0,<1.16.0",
    "pandas>=2.3.0,<2.4.0",
    "scikit-learn>=1.7.0,<1.8.0",
    "statsmodels>=0.14.0,<0.15.0",
    "pyarrow>=23.0.0,<24.0.0",
    "grpcio>=1.78.0,<1.79.0",
    "protobuf>=6.31.0,<6.32.0",
    "requests>=2.32.0,<2.33.0",
]

[dependency-groups]
controller = [
    "hypercorn>=0.18.0,<0.19.0",
    "Quart>=0.20.0,<0.21.0",
    "dnspython>=2.8.0,<2.9.0",
]
worker = [
    "duckdb>=1.5.0,<1.6.0",
    "psutil>=7.2.0,<7.3.0",
    "grpcio-health-checking>=1.78.0,<1.79.0",
]
aggregation-server = [
    "tomli>=2.4.0,<2.5.0",
    "grpcio-health-checking>=1.78.0,<1.79.0",
    "numpy>=2.2.0,<2.3.0",
    "pyarrow>=23.0.0,<24.0.0",
]
dev = [
    "pytest>=9.0.0,<9.1.0",
    "pytest-xdist>=3.8.0,<3.9.0",
    "pytest-subtests>=0.15.0,<0.16.0",
    "pytest-cov>=7.0.0,<7.1.0",
    "invoke>=2.2.0,<2.3.0",
    "toml>=0.10.0,<0.11.0",
    "termcolor>=3.3.0,<3.4.0",
    "ruff==0.15.5",
    "pre-commit>=4.5.0,<4.6.0",
    "coverage[toml]>=7.9.2,<8.0.0",
    "grpcio-tools>=1.78.0,<1.79.0",
    "tqdm>=4.67.0,<4.68.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exaflow"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow, mostly integration tests (deselect with '-m \"not slow\"')",
    "very_slow: marks tests as very_slow, integration tests with temporary container dependencies (deselect with '-m \"not very_slow\"')",
    "smpc: marks the tests validating smpc functionality (deselect with '-m \"not smpc\"')",
    "smpc_cluster: marks the tests that need smpc cluster deployment (deselect with '-m \"not smpc_cluster\"')",
]
filterwarnings = ["ignore::DeprecationWarning"]
norecursedirs = ["tests/testcase_generators"]

[tool.coverage.run]
source_pkgs = ['exaflow']
dynamic_context = 'test_function'
omit = [
    "exaflow/protos/*",
]

[tool.coverage.report]
exclude_lines = ['def __repr__', 'raise NotImplementedError', 'pragma: no cover']
show_missing = true

[tool.coverage.html]
show_contexts = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
force-single-line = true
