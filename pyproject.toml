[tool.poetry]
name = "exaflow"
version = "1.0.0"
description = "Core engine for the Medical Informatics Platform"
authors = ["Your Name <you@example.com>"]
packages = [
    { include = "exaflow" },
]

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
click = "~8.3"
pydantic = "~1.10"
envtoml = "~0.4"
numpy = "~2.2"
scipy = "~1.15"
pandas = "~2.3"
scikit-learn = "~1.7"
statsmodels = "~0.14"
pyarrow = "~23.0"
grpcio = "~1.78"
protobuf = "~6.31"
requests = "~2.32"
patsy = "~0.5"

[tool.poetry.group.controller.dependencies]
hypercorn = "~0.17"
Quart = "~0.20"
asgiref = "~3.11"
dnspython = "~2.8"

[tool.poetry.group.worker.dependencies]
psutil = "~5.9"
duckdb = "~1.1"
grpcio-health-checking = "~1.78"

[tool.poetry.group.aggregation-server.dependencies]
tomli = "~2.4"
grpcio-health-checking = "~1.78"
numpy = "~2.2"
pyarrow = "~23.0"

#[tool.poetry.group.flower.dependencies]
#flwr = "~1.23"
#xgboost = {version = "~2.1", markers = "sys_platform == 'darwin'"}
#xgboost-cpu = {version = "~2.1", markers = "sys_platform != 'darwin'"}

[tool.poetry.group.dev.dependencies]
pytest = "~9.0"
pytest-xdist = "~3.8"
pytest-subtests = "~0.15"
pytest-cov = "~7.0"
invoke = "~2.2"
toml = "~0.10"
termcolor = "~3.3"
ruff = "0.15.5" # Must be upgraded together with github actions and pre-commit configuration
pre-commit = "~4.5"
coverage = {extras = ["toml"], version = "^7.9.2"}
grpcio-tools = "~1.78"
tqdm = "~4.67"
psutil = "~5.9"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow, mostly integration tests (deselect with '-m \"not slow\"')",
    "very_slow: marks tests as very_slow, integration tests with temporary container dependencies (deselect with '-m \"not very_slow\"')",
    "smpc: marks the tests validating smpc functionality (deselect with '-m \"not smpc\"')",
    "smpc_cluster: marks the tests that need smpc cluster deployment (deselect with '-m \"not smpc_cluster\"')",
]
filterwarnings = ["ignore::DeprecationWarning"]
norecursedirs = ["tests/testcase_generators"]

[tool.coverage.run]
source_pkgs = ['exaflow']
dynamic_context = 'test_function'
omit = [
    "exaflow/protos/*",
]

[tool.coverage.report]
exclude_lines = ['def __repr__', 'raise NotImplementedError', 'pragma: no cover']
show_missing = true

[tool.coverage.html]
show_contexts = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
force-single-line = true
