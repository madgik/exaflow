namespace: default
managed_cluster: false
localnodes: 2

exaflow_images:
  repository: madgik
  version: 1.0.0
  # Per-image tags; each falls back to version when empty. Argo CD Image Updater sets these
  # to "<moving tag>@sha256:<digest>" on the staging Applications.
  controller_tag: ""
  worker_tag: ""
  aggregation_server_tag: ""

federation: dementia

log_level: INFO
framework_log_level: ERROR

# Send and receive limit, in mebibytes, for every gRPC message on the
# controller, workers, and aggregation server.
grpc_max_message_mb: 100

max_concurrent_experiments: 32

flower:
  enabled: true
  execution_timeout: 30
  server_port: 8080

controller:
  workers_dns: "exaflow-workers-service"
  worker_landscape_aggregator_update_interval: 30
  worker_tasks_timeout: 300
  # Shutdown budget. The controller does not read these keys: they only size the
  # pod's terminationGracePeriodSeconds (and the preStop sleep). The values the
  # controller runs with live in exaflow/controller/services/controller_shutdown.py
  # and exaflow/controller/http/server_config.py. A test fails when these
  # defaults differ from them, and overriding one here does not change the drain.
  # The grace period is the sum. It does not include worker_tasks_timeout.
  shutdown_prestop_delay: 5
  graceful_timeout: 120
  shutdown_rpc_cancel_timeout: 5
  shutdown_cleanup_timeout: 10
  shutdown_timeout: 60
  shutdown_grace_margin: 20

globalworker_identifier: globalworker

aggregation_server:
  enabled: true
  max_wait_for_aggregation_inputs: 60
  dns: "exaflow-aggregation-service"

smpc:
  enabled: false
  optional: false
  image: gpikra/coordinator:v7.0.7.4
  db_image: mongo:5.0.8
  queue_image: redis:alpine3.15
  get_result_interval: 5
  get_result_max_retries: 100

storage:
  type: hostPath

  hostPath:
    db:
      localworker: "/opt/exaflow/localworker"
      globalworker: "/opt/exaflow/globalworker"

  cephfs:
    storageClassName: ceph-corbo-cephfs-retain

    controller:
      size: 1Gi

    localworker:
      db:
        size: 4Gi
        accessModes:
          - ReadWriteOnce
      csvs:
        size: 4Gi
        accessModes:
          - ReadWriteMany
      creds:
        size: 100Mi
        accessModes:
          - ReadWriteMany

    globalworker:
      db:
        size: 4Gi
        accessModes:
          - ReadWriteOnce
      csvs:
        size: 4Gi
        accessModes:
          - ReadWriteMany
      creds:
        size: 100Mi
        accessModes:
          - ReadWriteMany
