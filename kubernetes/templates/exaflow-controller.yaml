apiVersion: apps/v1
kind: Deployment
metadata:
  name: exaflow-controller-deployment
  namespace: {{ .Values.namespace }}
  labels:
    app: exaflow-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exaflow-controller
  template:
    metadata:
      labels:
        app: exaflow-controller
    spec:
      # Shutdown budget, matching exaflow/controller/services/controller_shutdown.py:
      # preStop delay + graceful drain + cancel in-flight RPCs + aggregation
      # cleanup + Uvicorn lifespan shutdown hook + margin. Shutdown cancels worker
      # RPCs, so this does not add worker_tasks_timeout. Kubelet stops the
      # liveness and startup probes of a terminating pod (SyncTerminatingPod
      # calls StopLivenessAndStartup, then killPod), so /livez failing after the
      # listen socket closes does not restart the pod.
      terminationGracePeriodSeconds: {{ add .Values.controller.shutdown_prestop_delay .Values.controller.graceful_timeout .Values.controller.shutdown_rpc_cancel_timeout .Values.controller.shutdown_cleanup_timeout .Values.controller.shutdown_timeout .Values.controller.shutdown_grace_margin }}
      {{- if not .Values.managed_cluster }}
      nodeSelector:
        master: "true"
      {{- end }}

      containers:
      - name: controller
        image: {{ .Values.exaflow_images.repository }}/exaflow_controller:{{ .Values.exaflow_images.controller_tag | default .Values.exaflow_images.version }}
        ports:
          - containerPort: 5000

        lifecycle:
          preStop:
            # Keep serving while the Endpoints update removes this pod. Uvicorn
            # closes its listen socket as soon as it gets SIGTERM.
            exec:
              command: ["sleep", {{ quote .Values.controller.shutdown_prestop_delay }}]

        env:
        - name: RABBITMQ_ENABLED
          value: {{ .Values.rabbitmq.enabled | quote }}
        {{- if .Values.rabbitmq.enabled }}
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.rabbitmq.existing_secret | quote }}
              key: {{ .Values.rabbitmq.url_secret_key | quote }}
        {{- range $key, $value := .Values.rabbitmq }}
        {{- if has $key (list "request_queue" "dead_letter_queue" "max_result_bytes" "queue_max_bytes" "reply_ttl_ms" "dead_letter_ttl_ms" "operation_timeout" "publish_timeout" "shutdown_drain_timeout") }}
        - name: RABBITMQ_{{ $key | upper }}
        {{- if has $key (list "max_result_bytes" "queue_max_bytes" "reply_ttl_ms" "dead_letter_ttl_ms") }}
          value: {{ $value | int64 | quote }}
        {{- else }}
          value: {{ $value | quote }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        - name: NODE_IDENTIFIER
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: FEDERATION
          value: {{ .Values.federation }}
        - name: LOG_LEVEL
          value: {{ .Values.log_level }}
        - name: FRAMEWORK_LOG_LEVEL
          value: {{ .Values.framework_log_level }}
        - name: DEPLOYMENT_TYPE
          value: "KUBERNETES"
        - name: WORKER_LANDSCAPE_AGGREGATOR_UPDATE_INTERVAL
          value: {{ quote .Values.controller.worker_landscape_aggregator_update_interval }}
        - name: WORKER_TASKS_TIMEOUT
          value: {{ quote .Values.controller.worker_tasks_timeout }}
        - name: GRPC_MAX_MESSAGE_MB
          value: {{ quote .Values.grpc_max_message_mb }}
        - name: MAX_CONCURRENT_EXPERIMENTS
          value: {{ quote .Values.max_concurrent_experiments }}
        - name: AGGREGATION_SERVER_ENABLED
          value: {{ quote .Values.aggregation_server.enabled }}
        - name: AGGREGATION_SERVER_DNS
          value: {{ quote .Values.aggregation_server.dns }}
        - name: WORKERS_DNS
          value: {{ quote .Values.controller.workers_dns }}
        - name: WORKERS_PORT
          value: "5672"
        startupProbe:
          httpGet:
            path: /livez
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /livez
            port: 5000
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: 5000
          periodSeconds: 30
          timeoutSeconds: {{ .Values.controller.worker_tasks_timeout }}
          failureThreshold: 3


---

apiVersion: v1
kind: Service
metadata:
  name: exaflow-controller-service
  namespace: {{ .Values.namespace }}
spec:
  {{- if not .Values.managed_cluster }}
  type: LoadBalancer
  {{- end }}
  selector:
    app: exaflow-controller
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      {{- if not .Values.managed_cluster }}
      nodePort: 30000
      {{- end }}

---

apiVersion: v1
kind: Service
metadata:
  name: exaflow-workers-service
  namespace: {{ .Values.namespace }}
spec:
  clusterIP: None
  selector:
    app: exaflow-worker
  ports:
    - protocol: TCP
      port: 5672
      targetPort: 5672
