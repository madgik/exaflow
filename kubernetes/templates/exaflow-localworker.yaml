{{- if gt (int .Values.worker_count) 0 }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: exaflow-localworker
  namespace: {{ .Values.namespace }}
  labels:
    app: exaflow-worker
    nodeType: localworker
spec:
  serviceName: "exaflow-worker"
  podManagementPolicy: Parallel
  replicas: {{ .Values.worker_count }}
  selector:
    matchLabels:
      app: exaflow-worker
      nodeType: localworker
  template:
    metadata:
      namespace: {{ .Values.namespace }}
      labels:
        app: exaflow-worker
        nodeType: localworker
    spec:
      {{ if not .Values.managed_cluster }}
      nodeSelector:
        worker: "true"
      {{ end }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: nodeType
                operator: In
                values:
                - localworker
            topologyKey: kubernetes.io/hostname
      {{- if .Values.aggregation_server.tls.enabled }}
      securityContext:
        fsGroup: 10001
      {{- end }}
      volumes:
        - name: duckdb-data
          emptyDir: {}
      # HostPath volumes if hostPath selected
      {{ if not .Values.managed_cluster }}
        - name: csv-data
          hostPath:
            path: {{ printf "%s/csvs" .Values.storage.hostPath.db.localworker }}
      {{ end }}
      {{ if .Values.aggregation_server.tls.enabled }}
        - name: aggregation-tls
          secret:
            secretName: {{ .Values.aggregation_server.tls.worker_secret | quote }}
            defaultMode: 288 # 0440 (readable by appuser gid 10001)
      {{ end }}

      containers:
      - name: worker
        image: {{ .Values.exaflow_images.repository }}/exaflow_worker:{{ .Values.exaflow_images.worker_tag | default .Values.exaflow_images.version }}
        volumeMounts:
        - mountPath: /opt/data
          name: duckdb-data
        - mountPath: /opt/csvs
          name: csv-data
        {{ if .Values.aggregation_server.tls.enabled }}
        - mountPath: /etc/exaflow/tls/aggregation
          name: aggregation-tls
          readOnly: true
        {{ end }}
        env:
        - name: WORKER_IDENTIFIER
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: FEDERATION
          value: {{ .Values.federation }}
        - name: LOG_LEVEL
          value: {{ .Values.log_level }}
        - name: FRAMEWORK_LOG_LEVEL
          value: {{ .Values.framework_log_level }}
        - name: WORKER_TASKS_TIMEOUT
          value: {{ quote .Values.controller.worker_tasks_timeout }}
        - name: DATA_PATH
          value: "/opt/csvs"
        - name: DUCKDB_PATH
          value: "/opt/data/data_models.duckdb"
        - name: GRPC_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: GRPC_PORT
          value: "5672"
        # One thread per concurrent analysis plus spare threads for metadata
        # and health calls (WORKER_GRPC_SPARE_THREADS in tasks.py).
        - name: GRPC_MAX_WORKERS
          value: {{ .Values.max_concurrent_experiments | int | add 4 | quote }}
        - name: GRPC_MAX_MESSAGE_MB
          value: {{ quote .Values.grpc_max_message_mb }}
        - name: AGGREGATION_SERVER_ENABLED
          value: {{ quote .Values.aggregation_server.enabled }}
        - name: AGGREGATION_SERVER_DNS
          value: {{ quote .Values.aggregation_server.dns }}
        {{ if .Values.aggregation_server.tls.enabled }}
        - name: AGGREGATION_TLS_ENABLED
          value: "true"
        - name: AGGREGATION_TLS_CA_CERT_PATH
          value: "/etc/exaflow/tls/aggregation/ca.crt"
        - name: AGGREGATION_TLS_CERT_PATH
          value: "/etc/exaflow/tls/aggregation/$(WORKER_IDENTIFIER).crt"
        - name: AGGREGATION_TLS_KEY_PATH
          value: "/etc/exaflow/tls/aggregation/$(WORKER_IDENTIFIER).key"
        {{ if .Values.aggregation_server.tls.target_name_override }}
        - name: AGGREGATION_TLS_TARGET_NAME_OVERRIDE
          value: {{ quote .Values.aggregation_server.tls.target_name_override }}
        {{ end }}
        {{ end }}
        startupProbe:
          exec:
            command:
              - python
              - -m
              - exaflow.worker.healthcheck
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 30
          failureThreshold: 66
        livenessProbe:
          exec:
            command:
              - python
              - -m
              - exaflow.worker.healthcheck
          periodSeconds: 60
          timeoutSeconds: 30
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
              - python
              - -m
              - exaflow.worker.healthcheck
          periodSeconds: 10
          timeoutSeconds: 30
          failureThreshold: 15


  {{- if .Values.managed_cluster }}
  volumeClaimTemplates:
    - metadata:
        name: csv-data
        annotations:
          # tells Argo CD: do not prune (delete) this resource
          argocd.argoproj.io/sync-options: Delete=false,Prune=false
      spec:
        storageClassName: {{ .Values.storage.cephfs.storageClassName }}
        accessModes:
          - {{ index .Values.storage.cephfs.localworker.csvs.accessModes 0 }}
        resources:
          requests:
            storage: {{ .Values.storage.cephfs.localworker.csvs.size }}

  {{- end }}
{{- end }}
