syntax = "proto3";

package exaflow.feta;

import "google/protobuf/struct.proto";

// Separate services: existing Exareme3 RPCs are unaffected.
service FetaWorker {
  rpc InitializeContext(InitializeRequest) returns (InitializeResponse);
  rpc Execute(ExecuteRequest) returns (TensorDescriptor);
  rpc Cleanup(ContextRequest) returns (Ack);
}

service FetaAggregation {
  rpc Prepare(PrepareRequest) returns (Ack);
  rpc Submit(SubmitRequest) returns (Ack);
  rpc Fetch(StepRequest) returns (TensorValue);
  rpc Cleanup(ContextRequest) returns (Ack);
}

message Ack {}
message ContextRequest { string context_id = 1; }
message StepRequest {
  string context_id = 1;
  uint64 step = 2;
}
message DataSelection {
  string data_model = 1;
  repeated string datasets = 2;
  repeated string variables = 3;
  google.protobuf.Struct filters = 4;
}
message InitializeRequest {
  string context_id = 1;
  DataSelection data = 2;
  repeated string x = 3;
  repeated string y = 4;
  repeated string column_groups = 5;
}
message InitializeResponse {
  string worker_id = 1;
  TensorDescriptor x = 2;
  TensorDescriptor y = 3;
  repeated NamedTensor columns = 4;
  optional uint64 minimum_group_size = 5;
}
message NamedTensor {
  string group = 1;
  string name = 2;
  TensorDescriptor tensor = 3;
}
message TensorDescriptor {
  string tensor_id = 1;
  repeated int64 shape = 2;
  string dtype = 3;
  // -1 denotes an additive partial with no remaining distributed dimension.
  int32 partition_axis = 4;
  string row_layout = 5;
}
message StringArray {
  repeated string values = 1;
  string dtype = 2;
}
message TensorValue {
  oneof encoding {
    bytes arrow = 1;
    StringArray strings = 2;
  }
}
message Operand {
  // Required for array literals; Arrow represents NumPy bool tensors as uint8.
  string array_dtype = 7;
  oneof value {
    string tensor_id = 1;
    double real = 2;
    sint64 integer = 3;
    TensorValue array = 4;
    string text = 5;
    bool boolean = 6;
  }
}
enum OperationType {
  OPERATION_UNSPECIFIED = 0;
  ADD = 1;
  SUBTRACT = 2;
  MULTIPLY = 3;
  DIVIDE = 4;
  POWER = 5;
  TRANSPOSE = 6;
  SUM = 7;
  MATMUL = 8;
  LENGTH = 9;
  EQUAL = 10;
  COLUMN = 11;
  FILTER = 12;
  MIN = 13;
  MAX = 14;
  UNIQUE = 15;
  ONES_LIKE = 16;
  COLUMN_STACK = 17;
  EXP = 18;
  LOG = 19;
  WHERE = 20;
  HISTOGRAM = 21;
}
message LocalOperation {
  OperationType type = 1;
  repeated Operand inputs = 2;
  optional int32 axis = 3;
  // Shared lineage for results selected with the same distributed mask.
  string selection_layout = 4;
}
message ExecuteRequest {
  string context_id = 1;
  LocalOperation operation = 2;
  // Zero for a local result; otherwise submit the partial to this prepared step.
  uint64 aggregation_step = 3;
}
enum AggregationKind {
  SUM_VALUES = 0;
  MIN_VALUES = 1;
  MAX_VALUES = 2;
  UNION_VALUES = 3;
}
message PrepareRequest {
  string context_id = 1;
  uint64 step = 2;
  repeated string worker_ids = 3;
  repeated int64 shape = 4;
  string dtype = 5;
  AggregationKind kind = 6;
}
message SubmitRequest {
  string context_id = 1;
  uint64 step = 2;
  string worker_id = 3;
  TensorValue value = 4;
}
