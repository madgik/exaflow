node_identifier = "$NODE_IDENTIFIER"
federation = "$FEDERATION"

log_level = "$LOG_LEVEL"
framework_log_level = "$FRAMEWORK_LOG_LEVEL"

deployment_type="$DEPLOYMENT_TYPE"

worker_landscape_aggregator_update_interval="$WORKER_LANDSCAPE_AGGREGATOR_UPDATE_INTERVAL"
worker_tasks_timeout="$WORKER_TASKS_TIMEOUT"
max_concurrent_experiments="$MAX_CONCURRENT_EXPERIMENTS"

[flower]
enabled = "$FLOWER_ENABLED"
execution_timeout="$FLOWER_EXECUTION_TIMEOUT"
server_port="$FLOWER_SERVER_PORT"

[localworkers]
config_file="$LOCALWORKERS_CONFIG_FILE"
dns="$LOCALWORKERS_DNS"
port="$LOCALWORKERS_PORT"

[aggregation_server]
enabled = "$AGGREGATION_SERVER_ENABLED"
dns= "$AGGREGATION_SERVER_DNS"


[smpc]
enabled = "$SMPC_ENABLED"
optional = "$SMPC_OPTIONAL"
coordinator_address = "$SMPC_COORDINATOR_ADDRESS"
get_result_interval = "$SMPC_GET_RESULT_INTERVAL"
get_result_max_retries = "$SMPC_GET_RESULT_MAX_RETRIES"
[smpc.dp]
enabled = "$DP_ENABLED"
sensitivity = "$DP_SENSITIVITY"
privacy_budget = "$DP_PRIVACY_BUDGET"

[grpc]
max_message_mb = "${GRPC_MAX_MESSAGE_MB:-100}"

[rabbitmq]
enabled = "${RABBITMQ_ENABLED:-false}"
url = "${RABBITMQ_URL:-}"
request_queue = "${RABBITMQ_REQUEST_QUEUE:-exaflow.analysis.requests}"
dead_letter_queue = "${RABBITMQ_DEAD_LETTER_QUEUE:-exaflow.analysis.dead}"
max_result_bytes = "${RABBITMQ_MAX_RESULT_BYTES:-16777216}"
queue_max_bytes = "${RABBITMQ_QUEUE_MAX_BYTES:-268435456}"
reply_ttl_ms = "${RABBITMQ_REPLY_TTL_MS:-86400000}"
dead_letter_ttl_ms = "${RABBITMQ_DEAD_LETTER_TTL_MS:-604800000}"
operation_timeout = "${RABBITMQ_OPERATION_TIMEOUT:-5}"
shutdown_drain_timeout = "${RABBITMQ_SHUTDOWN_DRAIN_TIMEOUT:-30}"
