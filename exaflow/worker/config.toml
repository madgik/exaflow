identifier = "$WORKER_IDENTIFIER"
federation = "$FEDERATION"

data_path = "$DATA_PATH"

log_level = "$LOG_LEVEL"
framework_log_level = "$FRAMEWORK_LOG_LEVEL"

[duckdb]
path = "$DUCKDB_PATH"

[privacy]
minimum_row_count = 10
protect_local_data = "$PROTECT_LOCAL_DATA"

[worker_tasks]
tasks_timeout="$WORKER_TASKS_TIMEOUT"

[grpc]
ip = "$GRPC_IP"
port = "$GRPC_PORT"
max_workers = "$GRPC_MAX_WORKERS"
max_message_mb = "${GRPC_MAX_MESSAGE_MB:-100}"

[aggregation_server]
enabled = "$AGGREGATION_SERVER_ENABLED"
dns= "$AGGREGATION_SERVER_DNS"

[aggregation_server.tls]
enabled = "$AGGREGATION_TLS_ENABLED"
ca_cert_path = "$AGGREGATION_TLS_CA_CERT_PATH"
cert_path = "$AGGREGATION_TLS_CERT_PATH"
key_path = "$AGGREGATION_TLS_KEY_PATH"
target_name_override = "$AGGREGATION_TLS_TARGET_NAME_OVERRIDE"
